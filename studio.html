<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0c10"><title>Director Assistant — 3D Camera Studio</title><style>:root{color-scheme:dark;--bg:#0a0c10;--panel:#141820;--line:#2b303a;--ink:#eef0f5;--muted:#9ca7b7;--accent:#ef4b32;--cyan:#6fc5d6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,Tahoma,sans-serif}button,input,select,textarea{font:inherit;background:#1b202a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 11px}button{cursor:pointer}button:hover,a:hover{border-color:var(--cyan)}button.active{border-color:var(--accent);background:#34211e}a{color:var(--cyan);text-decoration:none}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}.brand{font-size:21px;font-weight:850}.accent{color:var(--accent)}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.1em}.nav a{border:1px solid var(--line);padding:8px 12px;border-radius:8px}.shell{max-width:1700px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0}.main{display:grid;gap:12px}.viewgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.view{background:#080b10;border:1px solid var(--line);border-radius:9px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;min-height:170px;aspect-ratio:16/9}.view canvas{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}.view .overlay{position:absolute;top:8px;left:8px;pointer-events:none;font:11px monospace;background:#070a10bb;padding:5px 7px;border-radius:4px}.muted,small{color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:22px}h2{font-size:16px}h3{font-size:13px}.stack{display:grid;gap:10px}.field{display:grid;gap:4px}.field label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.field select,.field input{width:100%;min-width:0}input[type=range]{padding:0;accent-color:var(--accent)}.timeline{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}.timeline input{flex:1;min-width:25px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:8px;background:#0f131b;border-radius:8px}.metric strong{display:block;font-size:15px}.keygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.keygrid input{width:100%;min-width:0;padding:6px}.keygrid label{display:grid;font:11px monospace;color:var(--muted);gap:3px}.keybar{display:flex;gap:4px;overflow:auto;padding:5px 0;max-width:100%}.keybar button{min-width:36px;padding:5px;font:11px monospace}.notice{border-inline-start:2px solid var(--accent);background:#0f131b;padding:10px;border-radius:6px}.prompt{width:100%;min-height:85px;font:12px monospace;resize:vertical}.status{min-height:18px}.inspector{position:sticky;top:10px}.sep{height:1px;background:var(--line)}footer{grid-column:1/-1;color:var(--muted);font-size:12px}[dir=rtl] .eyebrow{letter-spacing:0}@media(max-width:1100px){.shell{grid-template-columns:1fr}.inspector{position:static}.viewgrid{grid-template-columns:1fr 1fr}.inspector .field{display:grid;grid-template-columns:1fr 2fr;align-items:center}}@media(max-width:650px){.shell{padding:10px}.viewgrid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}header{padding:12px}.panel{padding:12px}}.timingControls,.layergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.timingControls label{color:var(--muted);font-size:12px}.timingControls select,.layer select{width:100%;min-width:0}.layer{padding:11px;border:1px solid var(--line);border-radius:9px;background:#10151e;display:grid;gap:8px}.layer label{display:grid;gap:4px;color:var(--muted);font-size:12px}.layer input{width:100%}#curveGraph{background:#0a1018;border:1px solid var(--line);border-radius:8px;width:100%;height:auto;display:block;touch-action:none}.bezgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.bezgrid[hidden]{display:none}.bezgrid label{display:grid;gap:3px;font-size:11px;color:var(--muted)}.bezgrid input{min-width:0;width:100%;padding:6px}#applyCombo{border-color:var(--accent);background:#39231e}#grid{accent-color:var(--accent)}@media(max-width:650px){.timingControls,.layergrid{grid-template-columns:1fr}.bezgrid{grid-template-columns:1fr 1fr}}</style></head><body><header><div><div class="eyebrow">DIRECTOR ASSISTANT / PREVIS STUDIO</div><div class="brand">CAMERA<span class="accent">.</span>STUDIO</div></div><nav class="row nav"><a href="index.html" data-fa="خانه" data-en="Home"></a><a href="references.html" data-fa="کتابخانه" data-en="Atlas"></a><a href="models.html" data-fa="بدنه‌ها" data-en="Bodies"></a><button id="lang">English</button></nav></header>
<main class="shell"><div class="main"><section class="panel stack"><div class="row between"><div><div class="eyebrow">REAL 3D GEOMETRY / WEBGL</div><h1 data-fa="استودیو پیش‌نمایش و میزانسن" data-en="3D previs & blocking studio"></h1></div><small id="presetsCount"></small></div><div class="viewgrid"><div class="view" id="cameraView"><canvas id="camera" width="640" height="360" aria-label="Camera preview"></canvas><div class="overlay" id="hud"></div></div><div class="view"><canvas id="world" width="640" height="360" aria-label="Interactive 3D scene"></canvas><div class="overlay">SCENE / DRAG TO ORBIT · SCROLL TO ZOOM</div></div></div><div class="timeline" dir="ltr"><button id="play" aria-label="Play">▶</button><button id="reset" aria-label="Reset">↺</button><input id="time" type="range" min="0" max="1" step=".001" value="0" aria-label="Timeline"><small id="timeText"></small></div><div class="metrics" id="metrics" dir="ltr"></div><div id="status" role="status" class="status muted"></div></section>
<section class="panel stack"><div class="row between"><div><div class="eyebrow">TIMING / CURVE EDITOR</div><h2 data-fa="کنترل شتاب و منحنی سرعت" data-en="Timing & easing editor"></h2></div><small id="easeInfo" dir="ltr"></small></div><div class="timingControls"><label class="field"><span data-fa="نوع Ease" data-en="Ease preset"></span><select id="ease"></select></label><label class="field"><span data-fa="اعمال منحنی روی" data-en="Apply curve to"></span><select id="easeScope"><option value="shot" data-fa="کل شات" data-en="Whole shot"></option><option value="segment" data-fa="هر قطعه بین دو نقطه" data-en="Each keyframe segment"></option></select></label></div><canvas id="curveGraph" width="960" height="234" aria-label="Easing progress and normalized velocity"></canvas><div class="bezgrid" id="bezControls" dir="ltr"><label>X1<input id="bx1" type="number" min="0" max="1" step=".01"></label><label>Y1<input id="by1" type="number" min="-1" max="2" step=".01"></label><label>X2<input id="bx2" type="number" min="0" max="1" step=".01"></label><label>Y2<input id="by2" type="number" min="-1" max="2" step=".01"></label></div><small data-fa="نمودار پیشرفت و سرعت نرمال‌شده. در حالت Custom دستگیره‌های Bézier را بکش. منحنی‌های Back، Elastic و Bounce ممکن است از انتهای مسیر عبور کنند یا جهت حرکت را معکوس کنند." data-en="Normalized progress and velocity. Drag Bézier handles in Custom mode. Back, Elastic and Bounce may overshoot or reverse the motion."></small></section>
<section class="panel stack"><div class="row between"><div><div class="eyebrow">LAYERED CAMERA MOTION</div><h2 data-fa="ترکیب چند حرکت دوربین" data-en="Camera motion composer"></h2></div><select id="comboMode"><option value="parallel" data-fa="هم‌زمان" data-en="Simultaneous"></option><option value="sequence" data-fa="پشت سر هم" data-en="Sequential"></option></select></div><p class="muted" data-fa="مسیر فعلی پایه است. تا دو لایه از تغییرات موقعیت، جهت، لنز یا رول را به آن اضافه کن. خروجی مسیر قابل ویرایش است." data-en="The current path is the base. Add up to two layers of position, aim, focal length or roll changes. The output is an editable camera path."></p><div id="comboSummary" class="notice"></div><div class="layergrid"><div class="layer"><div class="eyebrow">LAYER 01</div><select id="layer1" aria-label="Motion layer 1"></select><select id="channel1" aria-label="Motion channel 1"></select><select id="layerEase1" aria-label="Layer 1 easing"></select><label><span data-fa="شدت / جهت" data-en="Strength / direction"></span> <output id="weight1Out"></output><input id="weight1" type="range" min="-2" max="2" step=".05" value=".6"></label></div><div class="layer"><div class="eyebrow">LAYER 02</div><select id="layer2" aria-label="Motion layer 2"></select><select id="channel2" aria-label="Motion channel 2"></select><select id="layerEase2" aria-label="Layer 2 easing"></select><label><span data-fa="شدت / جهت" data-en="Strength / direction"></span> <output id="weight2Out"></output><input id="weight2" type="range" min="-2" max="2" step=".05" value=".6"></label></div></div><div class="row"><button id="applyCombo" data-fa="ساخت مسیر ترکیبی" data-en="Build combined path"></button><button id="undoCombo" data-fa="بازگشت قبل از ترکیب" data-en="Undo composition"></button></div><small data-fa="حالت هم‌زمان: هر لایه در طول شات اجرا می‌شود. حالت ترتیبی: زمان بین مسیر پایه و لایه‌ها تقسیم می‌شود. جابه‌جایی در مختصات جهان است و حرکت سوژه از مسیر پایه حفظ می‌شود." data-en="Simultaneous: each layer spans the shot. Sequential: time is split among base and layers. Translation uses world coordinates; subject motion follows the base."></small></section><section class="panel stack"><div class="row between"><h2 data-fa="ویرایش نقاط کلیدی مسیر" data-en="Edit camera path keyframes"></h2><div class="row"><button id="insert" data-fa="افزودن نقطه" data-en="Insert key"></button><button id="delete" data-fa="حذف نقطه" data-en="Delete key"></button><button id="restore" data-fa="بازیابی پریست" data-en="Restore preset"></button></div></div><small data-fa="نقاط کلیدی به‌صورت یکنواخت در طول شات توزیع می‌شوند. محور Y بالا است؛ واحد متر؛ Roll بر حسب درجه." data-en="Keys are evenly spaced across the shot. Y is up, units are meters, roll is in degrees."></small><div class="keybar" id="keys" dir="ltr"></div><div id="keyFields" class="keygrid" dir="ltr"></div></section>
<section class="panel stack"><h2 data-fa="خروجی قابل استفاده در AI و Blender" data-en="AI and Blender deliverables"></h2><textarea class="prompt" id="prompt" dir="ltr" readonly></textarea><div class="row"><button id="copy" data-fa="کپی پرامپت" data-en="Copy prompt"></button><button id="json" data-fa="دانلود JSON مسیر" data-en="Export path JSON"></button><button id="blender" data-fa="اسکریپت Blender" data-en="Blender script"></button><button id="obj" data-fa="دانلود مدل OBJ صحنه" data-en="Export scene OBJ"></button><button id="record" data-fa="دانلود ویدیوی مرجع" data-en="Export reference video"></button><button id="save" data-fa="ذخیره پروژه" data-en="Save project"></button><button id="load" data-fa="بارگذاری پروژه" data-en="Load project"></button></div><small data-fa="فایل OBJ شامل هندسهٔ صحنه و سوژهٔ فعلی است. اسکریپت Blender مسیر دوربین، فاصله کانونی و هندسهٔ ساده را می‌سازد؛ فایل FBX نیست. ضبط ویدیو به پشتیبانی مرورگر وابسته است." data-en="OBJ contains scene and current subject geometry. Blender script reconstructs a camera path, focal length and simple scene geometry; it is not FBX. Video recording depends on browser support."></small></section></div>
<aside class="panel stack inspector"><h2 data-fa="تنظیمات شات" data-en="Shot settings"></h2><div class="field"><label for="searchPreset" data-fa="جست‌وجوی حرکت" data-en="Search motion"></label><input id="searchPreset" type="search" placeholder="e.g. orbit / مدار"></div><div class="field"><label for="preset" data-fa="پریست حرکت" data-en="Motion preset"></label><select id="preset"></select></div><div class="field"><label for="body" data-fa="بدنه دوربین" data-en="Camera body"></label><select id="body"></select></div><div class="field"><label for="sensor"><span data-fa="عرض سنسور (mm)" data-en="Sensor width (mm)"></span><output id="sensorOut"></output></label><input id="sensor" type="range" min="8" max="65" step=".01" value="36"></div><div class="field"><label for="lens"><span data-fa="ضریب فاصله کانونی" data-en="Focal length multiplier"></span><output id="lensOut"></output></label><input id="lens" type="range" min=".25" max="4" step=".05" value="1"></div><div class="field"><label for="height"><span data-fa="قد مدل کاراکتر" data-en="Character height"></span><output id="heightOut"></output></label><input id="height" type="range" min=".5" max="3" step=".01" value="1.8"></div><div class="field"><label for="scene" data-fa="محیط سه‌بعدی" data-en="3D environment"></label><select id="scene"></select></div><div class="field"><label for="light" data-fa="نور و آسمان" data-en="Lighting & sky"></label><select id="light"></select></div><div class="field"><label for="backdrop" data-fa="بک‌گراند دوردست" data-en="Distant background"></label><select id="backdrop"><option value="full" data-fa="صحنه کامل" data-en="Full environment"></option><option value="clean" data-fa="بدون بک دوردست" data-en="No distant scenery"></option><option value="neutral" data-fa="پس‌زمینه خنثی" data-en="Neutral background"></option></select></div><label class="row"><input id="grid" type="checkbox"><span data-fa="نمایش شبکهٔ اندازه‌گیری" data-en="Show measurement grid"></span></label><div class="field"><label for="subject" data-fa="مدل سه‌بعدی" data-en="3D subject"></label><select id="subject"><option value="mannequin">Mannequin</option><option value="robot">Robot</option><option value="sphere">Sphere on pedestal</option><option value="duo">Two mannequins</option><option value="trio">Three mannequins</option><option value="hero">Coated hero</option><option value="car">Car</option><option value="animal">Quadruped</option><option value="statue">Stone statue</option></select></div><div class="field"><label for="ratio" data-fa="نسبت تصویر" data-en="Aspect ratio"></label><select id="ratio"><option>16:9</option><option>21:9</option><option>2.39:1</option><option>9:16</option><option>4:3</option><option>1:1</option></select></div><div class="field"><label for="duration"><span data-fa="مدت (ثانیه)" data-en="Duration (seconds)"></span><output id="durationOut"></output></label><input id="duration" type="range" min="1" max="30" step=".5" value="5"></div><div class="notice"><small data-fa="مدل‌های سه‌بعدی Low-poly اختصاصی با هندسهٔ محیط و بک دوردست؛ نور و مه شماتیک. بدنه فقط عرض سنسور را تعیین می‌کند. سایهٔ واقعی، عمق میدان، شاتر، برخورد و اپتیک غیرخطی شبیه‌سازی نشده‌اند." data-en="Original low-poly 3D sets with distant geometry, schematic lighting and fog. Bodies select sensor width, not brand CAD. Cast shadows, depth of field, shutter, collisions and nonlinear optics are not simulated."></small></div></aside><footer>DIRECTOR ASSISTANT · WebGL 1 · Offline / no CDN · Geometry in meters</footer></main>
<script src="camera-library.js"></script><script src="camera-models.js"></script><script src="legacy-motion-paths.js"></script><script src="motion-paths.js"></script><script src="motion-tools.js"></script><script src="scene-library.js"></script><script src="studio.js"></script></body></html>
