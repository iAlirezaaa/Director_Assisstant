ta-en="Placement role"></span><select id="assetRole"><option value="subject">Subject / سوژه</option><option value="prop">Prop / آبجکت</option></select></label></div><div class="row"><button id="addAsset" data-fa="افزودن مدل آماده" data-en="Add bundled model"></button><button id="importModel" data-fa="Import فایل سه‌بعدی" data-en="Import local 3D model"></button><input id="modelFile" type="file" accept=".glb,.gltf,.obj,.mtl,.bin,.png,.jpg,.jpeg,.webp" multiple hidden></div><small data-fa="GLB، glTF و فایل‌های همراه BIN/تصویر یا OBJ/MTL. سقف ۳۰ مگابایت، هندسهٔ استاتیک و رنگ تقریبی؛ بدون انیمیشن ریگ و PBR کامل." data-en="GLB, glTF plus BIN/images, or OBJ/MTL. 30 MB selection limit, static geometry and approximate color; no rig animation or full PBR."></small><div id="assetInstances" class="asset-list"></div><div class="notice" id="assetInfo"></div><small data-fa="مدل‌های آماده CC0 از Kenney. مدل شخصی در صورت پشتیبانی IndexedDB در همان مرورگر ذخیره می‌شود." data-en="Bundled CC0 models by Kenney. Personal geometry persists locally when IndexedDB is available."></small></section><section class="panel stack" data-worktab="timing"><div class="row between"><div><div class="eyebrow">TIMING / CURVE EDITOR</div><h2 data-fa="کنترل شتاب و منحنی سرعت" data-en="Timing & easing editor"></h2></div><small id="easeInfo" dir="ltr"></small></div><div class="timingControls"><label class="field"><span data-fa="نوع Ease" data-en="Ease preset"></span><select id="ease"></select></label><label class="field"><span data-fa="اعمال منحنی روی" data-en="Apply curve to"></span><select id="easeScope"><option value="shot" data-fa="کل شات" data-en="Whole shot"></option><option value="segment" data-fa="هر قطعه بین دو نقطه" data-en="Each keyframe segment"></option></select></label></div><canvas id="curveGraph" width="960" height="234" aria-label="Easing progress and normalized velocity"></canvas><div class="bezgrid" id="bezControls" dir="ltr"><label>X1<input id="bx1" type="number" min="0" max="1" step=".01"></label><label>Y1<input id="by1" type="number" min="-1" max="2" step=".01"></label><label>X2<input id="bx2" type="number" min="0" max="1" step=".01"></label><label>Y2<input id="by2" type="number" min="-1" max="2" step=".01"></label></div><small data-fa="نمودار پیشرفت و سرعت نرمال‌شده. در حالت Custom دستگیره‌های Bézier را بکش. منحنی‌های Back، Elastic و Bounce ممکن است از انتهای مسیر عبور کنند یا جهت حرکت را معکوس کنند." data-en="Normalized progress and velocity. Drag Bézier handles in Custom mode. Back, Elastic and Bounce may overshoot or reverse the motion."></small></section>
<section class="panel stack" data-worktab="mix"><div class="row between"><div><div class="eyebrow">LAYERED CAMERA MOTION</div><h2 data-fa="ترکیب چند حرکت دوربین" data-en="Camera motion composer"></h2></div><select id="comboMode"><option value="parallel" data-fa="هم‌زمان" data-en="Simultaneous"></option><option value="sequence" data-fa="پشت سر هم" data-en="Sequential"></option></select></div><p class="muted" data-fa="مسیر فعلی پایه است. تا دو لایه از تغییرات موقعیت، جهت، لنز یا رول را به آن اضافه کن. خروجی مسیر قابل ویرایش است." data-en="The current path is the base. Add up to two layers of position, aim, focal length or roll changes. The output is an editable camera path."></p><div id="comboSummary" class="notice"></div><div class="layergrid"><div class="layer"><div class="eyebrow">LAYER 01</div><select id="layer1" aria-label="Motion layer 1"></select><select id="channel1" aria-label="Motion channel 1"></select><select id="layerEase1" aria-label="Layer 1 easing"></select><label><span data-fa="شدت / جهت" data-en="Strength / direction"></span> <output id="weight1Out"></output><input id="weight1" type="range" min="-2" max="2" step=".05" value=".6"></label></div><div class="layer"><div class="eyebrow">LAYER 02</div><select id="layer2" aria-label="Motion layer 2"></select><select id="channel2" aria-label="Motion channel 2"></select><select id="layerEase2" aria-label="Layer 2 easing"></select><label><span data-fa="شدت / جهت" data-en="Strength / direction"></span> <output id="weight2Out"></output><input id="weight2" type="range" min="-2" max="2" step=".05" value=".6"></label></div></div><div class="row"><button id="applyCombo" data-fa="ساخت مسیر ترکیبی" data-en="Build combined path"></button><button id="undoCombo" data-fa="بازگشت قبل از ترکیب" data-en="Undo composition"></button></div><small data-fa="حالت هم‌زمان: هر لایه در طول شات اجرا می‌شود. حالت ترتیبی: زمان بین مسیر پایه و لایه‌ها تقسیم می‌شود. جابه‌جایی در مختصات جهان است و حرکت سوژه از مسیر پایه حفظ می‌شود." data-en="Simultaneous: each layer spans the shot. Sequential: time is split among base and layers. Translation uses world coordinates; subject motion follows the base."></small></section><section class="panel stack" data-worktab="keys"><div class="row between"><h2 data-fa="ویرایش نقاط کلیدی مسیر" data-en="Edit camera path keyframes"></h2><div class="row"><button id="insert" data-fa="افزودن نقطه" data-en="Insert key"></button><button id="delete" data-fa="حذف نقطه" data-en="Delete key"></button><button id="restore" data-fa="بازیابی پریست" data-en="Restore preset"></button></div></div><small data-fa="نقاط کلیدی به‌صورت یکنواخت در طول شات توزیع می‌شوند. محور Y بالا است؛ واحد متر؛ Roll بر حسب درجه." data-en="Keys are evenly spaced across the shot. Y is up, units are meters, roll is in degrees."></small><div class="keybar" id="keys" dir="ltr"></div><div id="keyFields" class="keygrid" dir="ltr"></div></section>
<section class="panel stack" data-worktab="export"><h2 data-fa="خروجی قابل استفاده در AI و Blender" data-en="AI and Blender deliverables"></h2><textarea class="prompt" id="prompt" dir="ltr" readonly></textarea><div class="row"><button id="copy" data-fa="کپی پرامپت" data-en="Copy prompt"></button><button id="json" data-fa="دانلود JSON مسیر" data-en="Export path JSON"></button><button id="blender" data-fa="اسکریپت Blender" data-en="Blender script"></button><button id="obj" data-fa="دانلود مدل OBJ صحنه" data-en="Export scene OBJ"></button><button id="record" data-fa="دانلود ویدیوی مرجع" data-en="Export reference video"></button><button id="save" data-fa="ذخیره پروژه" data-en="Save project"></button><button id="load" data-fa="بارگذاری پروژه" data-en="Load project"></button></div><small data-fa="فایل OBJ شامل هندسهٔ صحنه و سوژهٔ فعلی است. اسکریپت Blender مسیر دوربین، فاصله کانونی و هندسهٔ ساده را می‌سازد؛ فایل FBX نیست. ضبط ویدیو به پشتیبانی مرورگر وابسته است." data-en="OBJ contains scene and current subject geometry. Blender script reconstructs a camera path, focal length and simple scene geometry; it is not FBX. Video recording depends on browser support."></small></section></div>
<aside class="panel stack inspector"><h2 data-fa="تنظیمات شات" data-en="Shot settings"></h2><div class="field"><label for="presetCat" data-fa="دسته حرکت" data-en="Motion category"></label><select id="presetCat"></select></div><div class="field"><label for="searchPreset" data-fa="جست‌وجوی حرکت" data-en="Search motion"></label><input id="searchPreset" type="search" placeholder="e.g. orbit / مدار"></div><div class="field"><label for="preset" data-fa="پریست حرکت" data-en="Motion preset"></label><select id="preset"></select></div><div class="field"><label for="body" data-fa="بدنه دوربین" data-en="Camera body"></label><select id="body"></select></div><div class="field"><label for="sensor"><span data-fa="عرض سنسور (mm)" data-en="Sensor width (mm)"></span><output id="sensorOut"></output></label><input id="sensor" type="range" min="8" max="65" step=".01" value="36"></div><div class="field"><label for="lens"><span data-fa="ضریب فاصله کانونی" data-en="Focal length multiplier"></span><output id="lensOut"></output></label><input id="lens" type="range" min=".25" max="4" step=".05" value="1"></div><div class="field"><label for="ratio" data-fa="نسبت تصویر" data-en="Aspect ratio"></label><select id="ratio"><option>16:9</option><option>21:9</option><option>2.39:1</option><option>9:16</option><option>4:3</option><option>1:1</option></select></div><div class="field"><label for="duration"><span data-fa="مدت (ثانیه)" data-en="Duration (seconds)"></span><output id="durationOut"></output></label><input id="duration" type="range" min="1" max="30" step=".5" value="5"></div><div class="notice"><small data-fa="مدل‌های سه‌بعدی Low-poly اختصاصی با هندسهٔ محیط و بک دوردست؛ نور و مه شماتیک. بدنه فقط عرض سنسور را تعیین می‌کند. سایهٔ واقعی، عمق میدان، شاتر، برخورد و اپتیک غیرخطی شبیه‌سازی نشده‌اند." data-en="Original low-poly 3D sets with distant geometry, schematic lighting and fog. Bodies select sensor width, not brand CAD. Cast shadows, depth of field, shutter, collisions and nonlinear optics are
