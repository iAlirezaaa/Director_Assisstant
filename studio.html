<section class="panel stack tool-panel" data-worktab="timing" id="panel-timing" role="tabpanel" aria-labelledby="tab-timing" tabindex="0"><div class="row between"><div><div class="eyebrow">TIMING / CURVE EDITOR</div><h2 class="section-title" data-fa="کنترل شتاب و منحنی سرعت" data-en="Timing & easing editor"></h2></div><small id="easeInfo" dir="ltr"></small></div><div class="timingControls"><label class="field"><span data-fa="نوع Ease" data-en="Ease preset"></span><select id="ease"></select></label><label class="field"><span data-fa="اعمال منحنی روی" data-en="Apply curve to"></span><select id="easeScope"><option value="shot" data-fa="کل شات" data-en="Whole shot"></option><option value="segment" data-fa="هر قطعه بین دو نقطه" data-en="Each keyframe segment"></option></select></label></div><canvas id="curveGraph" width="960" height="234" aria-label="Easing progress and normalized velocity"></canvas><div class="bezgrid" id="bezControls" dir="ltr"><label>X1<input id="bx1" dir="ltr" type="number" min="0" max="1" step=".01"></label><label>Y1<input id="by1" dir="ltr" type="number" min="-1" max="2" step=".01"></label><label>X2<input id="bx2" dir="ltr" type="number" min="0" max="1" step=".01"></label><label>Y2<input id="by2" dir="ltr" type="number" min="-1" max="2" step=".01"></label></div><small data-fa="نمودار پیشرفت و سرعت نرمال‌شده. در حالت Custom دستگیره‌های Bézier را بکش. منحنی‌های Back، Elastic و Bounce ممکن است از انتهای مسیر عبور کنند یا جهت حرکت را معکوس کنند." data-en="Normalized progress and velocity. Drag Bézier handles in Custom mode. Back, Elastic and Bounce may overshoot or reverse the motion."></small></section>
<section class="panel stack tool-panel" data-worktab="transitions" id="panel-transitions" role="tabpanel" aria-labelledby="tab-transitions" tabindex="0"><div class="row between"><h2 class="section-title" data-fa="ترنزیشن بین دو شات سه‌بعدی" data-en="Two-shot transition studio"></h2><small id="transitionCount"></small></div><div class="timingControls"><label class="field"><span data-fa="ترنزیشن" data-en="Transition"></span><select id="transitionType"></select></label><label class="field"><span data-fa="مسیر دوربین شات B" data-en="Shot B camera path"></span><select id="shotB"></select></label><label class="field"><span data-fa="محیط شات B" data-en="Shot B environment"></span><select id="sceneB"></select></label><label class="field"><span data-fa="مدت هم‌پوشانی" data-en="Transition overlap"></span><input id="transitionOverlap" type="range" min=".05" max=".9" step=".01" value=".25"></label></div><small id="transitionOverlapOut"></small><div class="transition-track" dir="ltr"><div id="transitionTrack"><span>A</span><span>MIX</span><span>B</span></div><div id="transitionPlayhead"></div></div><div class="notice" id="transitionExplain"></div><div class="row"><button class="primary" id="previewTransition" data-fa="پخش ترنزیشن" data-en="Play transition"></button><button id="clearTransition" data-fa="بازگشت به یک شات" data-en="Return to single shot"></button></div><small data-fa="ویدیوی استودیو شامل ترنزیشن است؛ اسکریپت Blender فقط شات A را صادر می‌کند. Match Cut نیازمند تطابق ترکیب‌بندی است." data-en="Studio video includes the transition; Blender exports shot A only. Match Cut requires authored framing alignment."></small></section>
<section class="panel stack tool-panel" data-worktab="mix" id="panel-mix" role="tabpanel" aria-labelledby="tab-mix" tabindex="0"><div class="row between"><div><div class="eyebrow">LAYERED CAMERA MOTION</div><h2 class="section-title" data-fa="ترکیب چند حرکت دوربین" data-en="Camera motion composer"></h2></div><select id="comboMode"><option value="parallel" data-fa="هم‌زمان" data-en="Simultaneous"></option><option value="sequence" data-fa="پشت سر هم" data-en="Sequential"></option></select></div><p class="muted" data-fa="مسیر فعلی پایه است. تا دو لایه از تغییرات موقعیت، جهت، لنز یا رول را به آن اضافه کن. خروجی مسیر قابل ویرایش است." data-en="The current path is the base. Add up to two layers of position, aim, focal length or roll changes. The output is an editable camera path."></p><div id="comboSummary" class="notice"></div><div class="layergrid"><div class="layer"><div class="eyebrow">LAYER 01</div><select id="layer1" aria-label="Motion layer 1"></select><select id="channel1" aria-label="Motion channel 1"></select><select id="layerEase1" aria-label="Layer 1 easing"></select><label><span data-fa="شدت / جهت" data-en="Strength / direction"></span> <output id="weight1Out"></output><input id="weight1" type="range" min="-2" max="2" step=".05" value=".6"></label></div><div class="layer"><div class="eyebrow">LAYER 02</div><select id="layer2" aria-label="Motion layer 2"></select><select id="channel2" aria-label="Motion channel 2"></select><select id="layerEase2" aria-label="Layer 2 easing"></select><label><span data-fa="شدت / جهت" data-en="Strength / direction"></span> <output id="weight2Out"></output><input id="weight2" type="range" min="-2" max="2" step=".05" value=".6"></label></div></div><div class="row"><button class="primary" id="applyCombo" data-fa="ساخت مسیر ترکیبی" data-en="Build combined path"></button><button id="undoCombo" data-fa="بازگشت قبل از ترکیب" data-en="Undo composition"></button></div><small data-fa="حالت هم‌زمان: هر لایه در طول شات اجرا می‌شود. حالت ترتیبی: زمان بین مسیر پایه و لایه‌ها تقسیم می‌شود. جابه‌جایی در مختصات جهان است و حرکت سوژه از مسیر پایه حفظ می‌شود." data-en="Simultaneous: each layer spans the shot. Sequential: time is split among base and layers. Translation uses world coordinates; subject motion follows the base."></small></section>
<section class="panel stack tool-panel" data-worktab="keys" id="panel-keys" role="tabpanel" aria-labelledby="tab-keys" tabindex="0"><div class="row between"><h2 class="section-title" data-fa="ویرایش نقاط کلیدی مسیر" data-en="Edit camera path keyframes"></h2><div class="row"><button class="primary" id="insert" data-fa="افزودن نقطه" data-en="Insert key"></button><button id="delete" data-fa="حذف نقطه" data-en="Delete key"></button><button id="restore" data-fa="بازیابی پریست" data-en="Restore preset"></button></div></div><small data-fa="نقاط کلیدی به‌صورت یکنواخت در طول شات توزیع می‌شوند. محور Y بالا است؛ واحد متر؛ Roll بر حسب درجه." data-en="Keys are evenly spaced across the shot. Y is up, units are meters, roll is in degrees."></small><div class="keybar" id="keys" dir="ltr"></div><div id="keyFields" class="keygrid" dir="ltr"></div></section>
<section class="panel stack tool-panel" data-worktab="export" id="panel-export" role="tabpanel" aria-labelledby="tab-export" tabindex="0"><div class="section-heading"><div><h2 data-fa="شاتت را با خودت ببر" data-en="Take your shot further"></h2><p class="muted" data-fa="ویدیو، مسیر دوربین یا صحنهٔ آمادهٔ ادامهٔ کار." data-en="Export a video, camera path or scene for your next step."></p></div></div><textarea class="prompt" id="prompt" dir="ltr" readonly></textarea><div class="export-actions"><button id="copy" data-fa="کپی پرامپت" data-en="Copy prompt"></button><button id="json" data-fa="دانلود JSON مسیر" data-en="Export path JSON"></button><button id="blender" data-fa="اسکریپت Blender" data-en="Blender script"></button><button id="obj" data-fa="دانلود مدل OBJ صحنه" data-en="Export scene OBJ"></button><button class="primary" id="record" data-fa="دانلود ویدیوی مرجع" data-en="Export reference video"></button><button id="save" data-fa="ذخیره پروژه" data-en="Save project"></button><button id="load" data-fa="بارگذاری پروژه" data-en="Load project"></button></div><small data-fa="فایل OBJ شامل هندسهٔ صحنه و سوژهٔ فعلی است. اسکریپت Blender مسیر دوربین، فاصله کانونی و هندسهٔ ساده را می‌سازد؛ فایل FBX نیست. ضبط ویدیو به پشتیبانی مرورگر وابسته است." data-en="OBJ contains scene and current subject geometry. Blender script reconstructs a camera path, focal length and simple scene geometry; it is not FBX. Video recording depends on browser support."></small></section>
