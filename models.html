<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Bodies | Director Assistant</title><style>:root{color-scheme:dark;--bg:#090b0f;--panel:#121720;--line:#292f39;--muted:#a0aaba;--fg:#edf0f5;--accent:#ef4b32;--cyan:#75c9d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,Tahoma,sans-serif}button,select,input{font:inherit;color:var(--fg);background:#1a202a;border:1px solid var(--line);padding:9px 12px;border-radius:8px}button{cursor:pointer}button:hover,a:hover{border-color:var(--cyan)}button.active{border-color:var(--accent);background:#31221f}a{color:var(--cyan);text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-size:21px;font-weight:850}.brand span{color:var(--accent)}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.1em}.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav a{padding:8px 12px;border:1px solid var(--line);border-radius:8px}.shell{max-width:1600px;margin:auto;padding:18px;display:grid;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.muted,small{color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:25px}h2{font-size:17px;margin-bottom:8px}h3{font-size:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:14px;align-items:start}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.filters input,.filters select{min-width:0;width:100%}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:8px;margin-top:12px;max-height:67vh;overflow:auto}.card{display:grid;gap:4px;text-align:start;background:#0e131b;min-height:113px}.card.selected{border-color:var(--accent)}.card small{font-size:11px}.card .badge{font-size:10px;color:var(--cyan)}.stack{display:grid;gap:12px}.detail{position:sticky;top:10px}.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:7px}.metric{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:9px}.metric strong{display:block;font-size:19px}.sensor{height:130px;background:#0a0e15;position:relative;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;overflow:hidden}.sensor canvas{width:100%;height:100%;max-height:130px}.notice{padding:10px;border-inline-start:2px solid var(--accent);background:#0e131a;border-radius:6px}.table{width:100%;border-collapse:collapse;text-align:start;font-size:12px}.table td,.table th{padding:7px;border-bottom:1px solid var(--line);text-align:start}.lens{width:100%;accent-color:var(--accent)}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:4px 7px;font-size:11px}.action{background:#38231f;border:1px solid var(--accent);padding:9px 12px;border-radius:8px;text-align:center;display:inline-block}.scroll{overflow:auto}footer{font-size:11px;color:var(--muted)}[dir=rtl] .eyebrow{letter-spacing:0}@media(max-width:900px){.layout{grid-template-columns:1fr}.detail{position:static}.cards{max-height:50vh}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}@media(max-width:480px){.shell{padding:10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:8px}header{padding:12px}}</style></head><body><header><div><div class="eyebrow">DIRECTOR ASSISTANT / EQUIPMENT</div><div class="brand">CAMERA<span>.</span>BODIES</div></div><nav class="nav"><a href="index.html" data-fa="خانه" data-en="Home"></a><a href="references.html" data-fa="کتابخانه" data-en="Atlas"></a><a href="studio.html" data-fa="استودیو ۳بعدی" data-en="3D Studio"></a><button id="lang">English</button></nav></header><main class="shell"><section class="panel stack"><h1 data-fa="مدل‌های واقعی دوربین و اپتیک" data-en="Real camera bodies & optics"></h1><p class="muted" data-fa="بدنه‌ها را مقایسه کن و اندازهٔ سنسور و لنز را مستقیماً به استودیو بفرست. عرض‌های بدون علامت «دادهٔ سازنده»، پریست تقریبی فرمت هستند، نه مشخصات دقیق دستگاه." data-en="Compare camera bodies, then send the optical setup to the studio. Widths without a manufacturer-data label are illustrative format presets, not exact camera specifications."></p><div class="compare" id="summary"></div></section><div class="layout"><section class="panel"><div class="row between"><h2 data-fa="دانشنامه بدنه‌ها" data-en="Body catalog"></h2><small id="count"></small></div><div class="filters"><input id="q" type="search" placeholder="Search / جست‌وجو" aria-label="Search cameras"><select id="brand" aria-label="Brand"></select><select id="type" aria-label="Type"></select></div><div id="cards" class="cards"></div></section><aside class="panel stack detail"><div><div class="eyebrow" id="kind"></div><h2 id="name"></h2><p class="muted" id="format"></p></div><div class="sensor"><canvas id="sensor" width="600" height="200"></canvas></div><div class="compare" id="metrics"></div><label><span data-fa="فاصله کانونی (میلی‌متر)" data-en="Focal length (mm)"></span> <strong id="mm" dir="ltr"></strong><input id="focal" class="lens" type="range" min="8" max="800" value="50"></label><div class="chips" id="lens"></div><div class="notice" id="note"></div><div class="row"><a id="studio" class="action" href="studio.html" data-fa="آزمایش در استودیو ۳بعدی" data-en="Test in 3D Studio"></a><button id="compareBtn" data-fa="افزودن به مقایسه" data-en="Add to comparison"></button><a id="official" target="_blank" rel="noopener noreferrer" data-fa="صفحهٔ سازنده" data-en="Manufacturer source"></a></div><div class="scroll"><table class="table" id="comparison"></table></div><small data-fa="زاویه دید افقی برای لنز rectilinear و عرض سنسور انتخابی محاسبه می‌شود. کراپ، استابیلیزیشن دیجیتال، فوکوس، رنگ و اعوجاج واقعی بدنه شبیه‌سازی نمی‌شوند." data-en="Horizontal angle of view is computed for a rectilinear lens and selected sensor width. Crop modes, digital stabilization, focus, color and real lens distortion are not simulated."></small></aside></div><footer>DIRECTOR ASSISTANT · Body catalog · Source links checked 2026-11-25 · Offline calculations</footer></main><script src="camera-models.js"></script><script>
"use strict";const D=window.CAMERA_MODELS,$=id=>document.getElementById(id),param=new URLSearchParams(location.search);let lang=param.get("lang")==="en"?"en":"fa",selected=D.models[0],focal=50,compare=[];const tr=(fa,en)=>lang==="fa"?fa:en,label=(arr)=>arr[lang==="fa"?1:0],fmt=m=>D.formats[m.format][lang],fov=(w,f)=>2*Math.atan(w/(2*f))*180/Math.PI;
function node(t,txt,c){let x=document.createElement(t);if(txt!==undefined)x.textContent=txt;if(c)x.className=c;return x}function opts(id,values){let e=$(id),v=e.value;e.replaceChildren();for(let [k,n] of values)e.add(new Option(n,k));e.value=values.some(x=>x[0]===v)?v:"all"}
function filters(){opts("brand",[["all",tr("همه برندها","All brands")],...[...new Set(D.models.map(m=>m.brand))].sort().map(x=>[x,x])]);opts("type",[["all",tr("همه انواع","All types")],...Object.entries(D.types).map(([k,v])=>[k,label(v)])])}
function renderCards(){let q=$("q").value.toLowerCase().trim(),b=$("brand").value,t=$("type").value,list=D.models.filter(m=>(b==="all"||m.brand===b)&&(t==="all"||m.type===t)&&(!q||[m.name,m.brand,fmt(m),label(D.types[m.type])].join(" ").toLowerCase().includes(q)));$("count").textContent=list.length+" / "+D.models.length;$("cards").replaceChildren();for(let m of list){let el=node("button",undefined,"card"+(m.id===selected.id?" selected":""));el.type="button";el.append(node("span",m.brand+" · "+label(D.types[m.type]),"badge"),node("strong",m.name),node("small",fmt(m)),node("small",m.width?m.width+" mm · "+(m.exact?tr("دادهٔ سازنده","Manufacturer data"):tr("پریست فرمت","Format preset")):tr("اپتیک ویژه","Specialized optics")));el.onclick=()=>{selected=m;renderCards();detail()};$("cards").append(el)}}
function metric(parent,n,v){let x=node("div",undefined,"metric");x.append(node("small",n),node("strong",v));parent.append(x)}
function sensor(){const c=$("sensor"),g=c.getContext("2d"),w=c.width,h=c.height;g.fillStyle="#0a0e15";g.fillRect(0,0,w,h);let scale=5.5,draw=(width,color,txt,y)=>{if(!width)return;let a=width*scale,b=a*.57;g.strokeStyle=color;g.lineWidth=2;g.strokeRect(w/2-a/2,h/2-b/2,a,b);g.fillStyle=color;g.font="13px monospace";g.textAlign="center";g.fillText(txt,w/2,y)};draw(36,"#697583","36 mm full frame",18);draw(selected.width,"#ef785e",selected.width?selected.width+" mm selected":"",h-12)}
function detail(){let m=selected;$("kind").textContent=m.brand+" / "+label(D.types[m.type]);$("name").textContent=m.name;$("format").textContent=fmt(m);$("mm").textContent=focal+" mm";$("focal").value=focal;$("metrics").replaceChildren();metric($("metrics"),tr("عرض سنسور","Sensor width"),m.width?m.width+" mm":"—");metric($("metrics"),tr("میدان دید افقی","HFOV"),m.width?fov(m.width,focal).toFixed(1)+"°":"—");metric($("metrics"),tr("معادل فول‌فریم افقی","36 mm equivalent"),m.width?(focal*36/m.width).toFixed(1)+" mm":"—");$("note").textContent=(m.width?(m.exact?tr("عرض سنسور از دادهٔ سازنده؛ کراپ و مود ضبط ممکن است متفاوت باشد.","Manufacturer sensor width; recording crop may vary."):tr("عرض سنسور پریست تقریبی فرمت است، نه مشخصات دقیق این بدنه.","Illustrative format width, not exact device specification.")):tr("این سیستم اپتیک تخصصی دارد؛ محاسبهٔ rectilinear برای آن اختصاص نیافته است.","Specialized optical system; no rectilinear device calculation assigned."))+(m.note?" "+m.note:"");$("official").href=m.url;$("studio").href="studio.html?body="+encodeURIComponent(m.id)+"&focal="+focal+"&lang="+lang;$("studio").style.display=m.width?"inline-block":"none";$("compareBtn").textContent=compare.some(x=>x===m.id)?tr("حذف از مقایسه","Remove from comparison"):tr("افزودن به مقایسه","Add to comparison");sensor();renderComparison()}
function renderComparison(){let table=$("comparison");table.replaceChildren();if(!compare.length)return;let head=node("tr");for(let s of [tr("مدل","Model"),tr("عرض","Width"),"HFOV"])head.append(node("th",s));table.append(head);for(let id of compare){let m=D.models.find(x=>x.id===id),row=node("tr");for(let s of [m.brand+" "+m.name,m.width?m.width+" mm":"—",m.width?fov(m.width,focal).toFixed(1)+"°":"—"])row.append(node("td",s));table.append(row)}}
function refresh(){document.documentElement.lang=lang;document.documentElement.dir=lang==="fa"?"rtl":"ltr";document.querySelectorAll("[data-fa]").forEach(e=>e.textContent=e.dataset[lang]);$("lang").textContent=tr("English","فارسی");filters();$("summary").replaceChildren();metric($("summary"),tr("مدل / خانواده","Models / families"),D.models.length);metric($("summary"),tr("سازنده","Manufacturers"),new Set(D.models.map(x=>x.brand)).size);metric($("summary"),tr("پریست فرمت","Format presets"),Object.keys(D.formats).length-1);metric($("summary"),tr("انواع بدنه","Body categories"),Object.keys(D.types).length);$("lens").replaceChildren();for(let f of D.lensPresets){let b=node("button",String(f));b.onclick=()=>{focal=f;detail()};$("lens").append(b)}renderCards();detail()}
$("lang").onclick=()=>{lang=lang==="fa"?"en":"fa";refresh()};$("q").oninput=renderCards;$("brand").onchange=renderCards;$("type").onchange=renderCards;$("focal").oninput=()=>{focal=Number($("focal").value);detail()};$("compareBtn").onclick=()=>{if(compare.includes(selected.id))compare=compare.filter(x=>x!==selected.id);else{if(compare.length>=6)compare.shift();compare.push(selected.id)}detail()};refresh();
</script></body></html>
